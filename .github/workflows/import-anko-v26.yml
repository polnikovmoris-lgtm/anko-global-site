name: Import ANKO Global v26

on:
  push:
    branches:
      - main
    paths:
      - ".anko-import/**"
      - ".github/workflows/import-anko-v26.yml"

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat .anko-import/part-* > /tmp/anko-global-v26.zip
          echo "1e254a0cc8e885f6e532ab31ccff3258f27c57e91ec57e3491e9db3634147a9e  /tmp/anko-global-v26.zip" | sha256sum --check

          mkdir -p /tmp/anko-global-v26
          unzip -q /tmp/anko-global-v26.zip -d /tmp/anko-global-v26
          source_dir="/tmp/anko-global-v26/anko-global-v26-2026-07-26"
          test -d "$source_dir/site"
          test -f "$source_dir/FILE-MANIFEST-SHA256.txt"

          (
            cd "$source_dir"
            sha256sum --check FILE-MANIFEST-SHA256.txt
          )

      - name: Import project files
        shell: bash
        run: |
          set -euo pipefail
          source_dir="/tmp/anko-global-v26/anko-global-v26-2026-07-26"
          cp -a "$source_dir"/. "$GITHUB_WORKSPACE"/

          rm -rf "$GITHUB_WORKSPACE/.anko-import"
          rm -f "$GITHUB_WORKSPACE/.github/workflows/import-anko-v26.yml"
          rmdir "$GITHUB_WORKSPACE/.github/workflows" 2>/dev/null || true
          rmdir "$GITHUB_WORKSPACE/.github" 2>/dev/null || true

          file_count="$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -print | wc -l)"
          test "$file_count" -eq 672

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Загрузка актуальной версии ANKO Global v26"
          git push origin HEAD:main
